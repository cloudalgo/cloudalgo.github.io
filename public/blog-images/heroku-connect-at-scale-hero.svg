<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" aria-hidden="true">
  <!-- Background -->
  <rect width="1200" height="600" fill="#F7F4F2"/>

  <!-- Vertical separator -->
  <line x1="578" y1="40" x2="578" y2="560" stroke="#F75A41" stroke-opacity="0.34" stroke-width="1"/>

  <!-- ══════════════════════════════════════════════ -->
  <!-- LEFT: the mapping console                       -->
  <!-- ══════════════════════════════════════════════ -->

  <rect x="38" y="40" width="514" height="520" rx="12" fill="#FFFFFF" stroke="#131110" stroke-opacity="0.15" stroke-width="1.5"/>

  <!-- Title bar -->
  <rect x="38" y="40" width="514" height="40" rx="12" fill="#131110" fill-opacity="0.08"/>
  <rect x="38" y="68" width="514" height="12" fill="#131110" fill-opacity="0.08"/>
  <line x1="38" y1="80" x2="552" y2="80" stroke="#F75A41" stroke-opacity="0.34" stroke-width="1"/>
  <circle cx="66" cy="60" r="6" fill="#131110" fill-opacity="0.16"/>
  <circle cx="88" cy="60" r="6" fill="#131110" fill-opacity="0.16"/>
  <circle cx="110" cy="60" r="6" fill="#131110" fill-opacity="0.16"/>
  <text x="295" y="64" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="11" fill="#131110" fill-opacity="0.62" text-anchor="middle" letter-spacing="0.06em">Heroku Connect · acme-prod</text>

  <!-- Table head -->
  <text x="56" y="110" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#131110" fill-opacity="0.68" letter-spacing="0.1em">OBJECT</text>
  <text x="196" y="110" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#131110" fill-opacity="0.68" letter-spacing="0.1em">MERGE KEY</text>
  <text x="452" y="110" text-anchor="end" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#131110" fill-opacity="0.68" letter-spacing="0.1em">ROWS</text>
  <text x="534" y="110" text-anchor="end" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#131110" fill-opacity="0.68" letter-spacing="0.1em">LAG</text>
  <line x1="56" y1="118" x2="534" y2="118" stroke="#F75A41" stroke-opacity="0.40" stroke-width="1"/>

  <!-- Rows -->
  <g font-family="'Courier New', Courier, monospace" font-size="11.5">
    <text x="56" y="140" fill="#131110" fill-opacity="0.86">Account</text>
    <text x="196" y="140" fill="#131110" fill-opacity="0.74">Acct_Ext__c</text>
    <text x="452" y="140" text-anchor="end" fill="#131110" fill-opacity="0.74">128,400</text>
    <text x="534" y="140" text-anchor="end" fill="#131110" fill-opacity="0.74">0:22</text>

    <text x="56" y="166" fill="#131110" fill-opacity="0.86">Contact</text>
    <text x="196" y="166" fill="#131110" fill-opacity="0.74">Ext_Id__c</text>
    <text x="452" y="166" text-anchor="end" fill="#131110" fill-opacity="0.74">412,900</text>
    <text x="534" y="166" text-anchor="end" fill="#131110" fill-opacity="0.74">1:04</text>
  </g>

  <!-- Flagged row 1 -->
  <rect x="48" y="176" width="496" height="26" rx="5" fill="#131110" fill-opacity="0.06"/>
  <rect x="48" y="176" width="3" height="26" rx="1.5" fill="#F75A41" fill-opacity="0.70"/>
  <g font-family="'Courier New', Courier, monospace" font-size="11.5">
    <text x="56" y="194" fill="#131110" fill-opacity="0.92">Order__c</text>
    <text x="196" y="194" fill="#131110" fill-opacity="0.86">— not set</text>
    <text x="452" y="194" text-anchor="end" fill="#131110" fill-opacity="0.86">86,120</text>
    <text x="534" y="194" text-anchor="end" fill="#131110" fill-opacity="0.86">18:41</text>
  </g>

  <g font-family="'Courier New', Courier, monospace" font-size="11.5">
    <text x="56" y="222" fill="#131110" fill-opacity="0.86">Invoice__c</text>
    <text x="196" y="222" fill="#131110" fill-opacity="0.74">Inv_Ref__c</text>
    <text x="452" y="222" text-anchor="end" fill="#131110" fill-opacity="0.74">240,003</text>
    <text x="534" y="222" text-anchor="end" fill="#131110" fill-opacity="0.74">2:10</text>
  </g>

  <!-- Flagged row 2 -->
  <rect x="48" y="232" width="496" height="26" rx="5" fill="#131110" fill-opacity="0.06"/>
  <rect x="48" y="232" width="3" height="26" rx="1.5" fill="#F75A41" fill-opacity="0.70"/>
  <g font-family="'Courier New', Courier, monospace" font-size="11.5">
    <text x="56" y="250" fill="#131110" fill-opacity="0.92">Usage__c</text>
    <text x="196" y="250" fill="#131110" fill-opacity="0.86">— not set</text>
    <text x="452" y="250" text-anchor="end" fill="#131110" fill-opacity="0.86">1,204,880</text>
    <text x="534" y="250" text-anchor="end" fill="#131110" fill-opacity="0.86">21:07</text>
  </g>

  <!-- Divider -->
  <line x1="56" y1="278" x2="534" y2="278" stroke="#F75A41" stroke-opacity="0.34" stroke-width="1"/>

  <!-- Meters -->
  <text x="56" y="308" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="10" font-weight="700" fill="#131110" fill-opacity="0.68" letter-spacing="0.08em">DAILY API CALLS</text>
  <rect x="216" y="298" width="240" height="10" rx="5" fill="#131110" fill-opacity="0.10"/>
  <rect x="216" y="298" width="187" height="10" rx="5" fill="#131110" fill-opacity="0.86"/>
  <text x="534" y="308" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#131110" fill-opacity="0.86">78%</text>

  <text x="56" y="340" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="10" font-weight="700" fill="#131110" fill-opacity="0.68" letter-spacing="0.08em">SYNC LAG, PEAK</text>
  <rect x="216" y="330" width="240" height="10" rx="5" fill="#131110" fill-opacity="0.10"/>
  <rect x="216" y="330" width="228" height="10" rx="5" fill="#131110" fill-opacity="0.86"/>
  <text x="534" y="340" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#131110" fill-opacity="0.86">21 min</text>

  <text x="56" y="372" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="10" font-weight="700" fill="#131110" fill-opacity="0.68" letter-spacing="0.08em">POLL INTERVAL</text>
  <rect x="216" y="362" width="240" height="10" rx="5" fill="#131110" fill-opacity="0.10"/>
  <rect x="216" y="362" width="42" height="10" rx="5" fill="#131110" fill-opacity="0.86"/>
  <text x="534" y="372" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#131110" fill-opacity="0.86">10s, set</text>

  <!-- Divider -->
  <line x1="56" y1="400" x2="534" y2="400" stroke="#F75A41" stroke-opacity="0.34" stroke-width="1"/>

  <!-- Stats -->
  <rect x="50" y="422" width="152" height="88" rx="9" fill="#131110" fill-opacity="0.06" stroke="#131110" stroke-opacity="0.14" stroke-width="1"/>
  <text x="72" y="478" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="38" font-weight="900" fill="#131110">2</text>
  <text x="72" y="496" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="9" font-weight="700" fill="#131110" fill-opacity="0.68" letter-spacing="0.06em">OBJECTS, NO KEY</text>

  <rect x="212" y="422" width="152" height="88" rx="9" fill="#131110" fill-opacity="0.06" stroke="#131110" stroke-opacity="0.14" stroke-width="1"/>
  <text x="234" y="478" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="38" font-weight="900" fill="#131110">0</text>
  <text x="234" y="496" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="9" font-weight="700" fill="#131110" fill-opacity="0.68" letter-spacing="0.06em">SYNC ERRORS RAISED</text>

  <rect x="374" y="422" width="178" height="88" rx="9" fill="#131110" fill-opacity="0.06" stroke="#131110" stroke-opacity="0.14" stroke-width="1"/>
  <text x="392" y="466" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="14" font-weight="700" fill="#131110" fill-opacity="0.92">Duplicates,</text>
  <text x="392" y="486" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="14" font-weight="700" fill="#131110" fill-opacity="0.92">not errors</text>
  <text x="392" y="504" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="10.5" fill="#131110" fill-opacity="0.74">upsert became insert</text>

  <text x="56" y="540" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="11" fill="#131110" fill-opacity="0.74">Everything above is green in the console. None of it is right.</text>

  <!-- ══════════════════════════════════════════════ -->
  <!-- RIGHT: the five failure modes                   -->
  <!-- ══════════════════════════════════════════════ -->

  <text x="618" y="70" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="15" font-weight="700" fill="#131110" fill-opacity="0.68" letter-spacing="0.14em">FIVE THINGS VOLUME BREAKS</text>

  <!-- Row 1 -->
  <rect x="618" y="102" width="4" height="46" rx="2" fill="#F75A41" fill-opacity="0.70"/>
  <text x="640" y="122" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="18" font-weight="600" fill="#131110" fill-opacity="0.92">No External ID on the merge key</text>
  <text x="1148" y="122" text-anchor="end" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="12" font-weight="700" fill="#131110" fill-opacity="0.68" letter-spacing="0.06em">DUPLICATES</text>
  <text x="640" y="142" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="13" fill="#131110" fill-opacity="0.74">Every re-poll inserts instead of upserting</text>

  <!-- Row 2 -->
  <rect x="618" y="164" width="4" height="46" rx="2" fill="#F75A41" fill-opacity="0.58"/>
  <text x="640" y="184" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="18" font-weight="600" fill="#131110" fill-opacity="0.92">Formula and roll-up fields mapped</text>
  <text x="1148" y="184" text-anchor="end" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="12" font-weight="700" fill="#131110" fill-opacity="0.68" letter-spacing="0.06em">DATA MODEL</text>
  <text x="640" y="204" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="13" fill="#131110" fill-opacity="0.74">Cached at sync time · writes back are ignored</text>

  <!-- Row 3 -->
  <rect x="618" y="226" width="4" height="46" rx="2" fill="#F75A41" fill-opacity="0.58"/>
  <text x="640" y="246" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="18" font-weight="600" fill="#131110" fill-opacity="0.92">Batched DML still runs your triggers</text>
  <text x="1148" y="246" text-anchor="end" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="12" font-weight="700" fill="#131110" fill-opacity="0.68" letter-spacing="0.06em">GOVERNOR LIMITS</text>
  <text x="640" y="266" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="13" fill="#131110" fill-opacity="0.74">A flow that is fine at 50/hr, at 50,000/hr</text>

  <!-- Row 4 -->
  <rect x="618" y="288" width="4" height="46" rx="2" fill="#F75A41" fill-opacity="0.46"/>
  <text x="640" y="308" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="18" font-weight="600" fill="#131110" fill-opacity="0.92">Polling lag grows with object count</text>
  <text x="1148" y="308" text-anchor="end" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="12" font-weight="700" fill="#131110" fill-opacity="0.68" letter-spacing="0.06em">SYNC LAG</text>
  <text x="640" y="328" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="13" fill="#131110" fill-opacity="0.74">15–20 minutes behind at peak, not real time</text>

  <!-- Row 5 -->
  <rect x="618" y="350" width="4" height="46" rx="2" fill="#F75A41" fill-opacity="0.46"/>
  <text x="640" y="370" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="18" font-weight="600" fill="#131110" fill-opacity="0.92">A field added in Salesforce, unmapped</text>
  <text x="1148" y="370" text-anchor="end" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="12" font-weight="700" fill="#131110" fill-opacity="0.68" letter-spacing="0.06em">SCHEMA DRIFT</text>
  <text x="640" y="390" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="13" fill="#131110" fill-opacity="0.74">Silent data loss · the column is simply never filled</text>

  <!-- Divider -->
  <line x1="618" y1="420" x2="1148" y2="420" stroke="#F75A41" stroke-opacity="0.40" stroke-width="1"/>

  <!-- The verdict -->
  <rect x="618" y="442" width="530" height="98" rx="9" fill="#131110" fill-opacity="0.84"/>
  <rect x="636" y="458" width="130" height="18" rx="9" fill="#F7F4F2" fill-opacity="0.16"/>
  <text x="701" y="470.5" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#F7F4F2" fill-opacity="0.92" text-anchor="middle" letter-spacing="0.08em">WHAT THEY SHARE</text>
  <text x="636" y="500" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="16" font-weight="700" fill="#F7F4F2" fill-opacity="0.95">None of the five raises an error.</text>
  <text x="636" y="524" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="13" fill="#F7F4F2" fill-opacity="0.80">They surface as a report that does not reconcile, weeks later.</text>
</svg>
