<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" aria-hidden="true">
  <!-- Background -->
  <rect width="1200" height="600" fill="#F7F4F2"/>

  <!-- Vertical separator -->
  <line x1="578" y1="40" x2="578" y2="560" stroke="#F75A41" stroke-opacity="0.34" stroke-width="1"/>

  <!-- ══════════════════════════════════════════════ -->
  <!-- LEFT: eight applications, three tiers           -->
  <!-- ══════════════════════════════════════════════ -->

  <text x="38" y="60" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="15" font-weight="700" fill="#131110" fill-opacity="0.68" letter-spacing="0.14em">EIGHT APPLICATIONS, THREE TIERS</text>

  <rect x="38" y="78" width="514" height="482" rx="12" fill="#FFFFFF" stroke="#131110" stroke-opacity="0.15" stroke-width="1.5"/>

  <!-- Process tier -->
  <text x="66" y="110" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="10" font-weight="700" fill="#131110" fill-opacity="0.68" letter-spacing="0.12em">PROCESS APIS · 4</text>
  <g font-family="'Courier New', Courier, monospace" font-size="11.5">
    <rect x="66" y="122" width="222" height="42" rx="8" fill="#131110" fill-opacity="0.07"/>
    <text x="80" y="148" fill="#131110" fill-opacity="0.86">dh-customer-papi</text>
    <rect x="302" y="122" width="222" height="42" rx="8" fill="#131110" fill-opacity="0.07"/>
    <text x="316" y="148" fill="#131110" fill-opacity="0.86">dh-journey-sync-papi</text>
    <rect x="66" y="174" width="222" height="42" rx="8" fill="#131110" fill-opacity="0.07"/>
    <text x="80" y="200" fill="#131110" fill-opacity="0.86">dh-case-sync-papi</text>
    <rect x="302" y="174" width="222" height="42" rx="8" fill="#131110" fill-opacity="0.07"/>
    <text x="316" y="200" fill="#131110" fill-opacity="0.86">dh-order-to-shipment</text>
  </g>

  <line x1="295" y1="216" x2="295" y2="240" stroke="#F75A41" stroke-opacity="0.70" stroke-width="2"/>
  <path d="M295 244 L291 236 L299 236 Z" fill="#F75A41" fill-opacity="0.70"/>

  <!-- System tier -->
  <text x="66" y="272" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="10" font-weight="700" fill="#131110" fill-opacity="0.68" letter-spacing="0.12em">SYSTEM APIS · 3</text>
  <g font-family="'Courier New', Courier, monospace">
    <rect x="66" y="284" width="146" height="58" rx="8" fill="#131110" fill-opacity="0.07"/>
    <text x="80" y="308" font-size="11.5" fill="#131110" fill-opacity="0.86">dh-salesforce</text>
    <text x="80" y="328" font-size="10" fill="#131110" fill-opacity="0.68">Person Accounts</text>

    <rect x="222" y="284" width="146" height="58" rx="8" fill="#131110" fill-opacity="0.07"/>
    <text x="236" y="308" font-size="11.5" fill="#131110" fill-opacity="0.86">dh-portal</text>
    <text x="236" y="328" font-size="10" fill="#131110" fill-opacity="0.68">X-Client-ID auth</text>

    <rect x="378" y="284" width="146" height="58" rx="8" fill="#131110" fill-opacity="0.07"/>
    <text x="392" y="308" font-size="11.5" fill="#131110" fill-opacity="0.86">dl-slp</text>
    <text x="392" y="328" font-size="10" fill="#131110" fill-opacity="0.68">Bearer token</text>
  </g>

  <line x1="295" y1="342" x2="295" y2="366" stroke="#F75A41" stroke-opacity="0.70" stroke-width="2"/>
  <path d="M295 370 L291 362 L299 362 Z" fill="#F75A41" fill-opacity="0.70"/>

  <!-- Batch tier -->
  <text x="66" y="398" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="10" font-weight="700" fill="#131110" fill-opacity="0.68" letter-spacing="0.12em">SCHEDULED BATCH · 1</text>
  <rect x="66" y="410" width="458" height="52" rx="8" fill="#F75A41" fill-opacity="0.10"/>
  <rect x="66" y="410" width="4" height="52" rx="2" fill="#F75A41" fill-opacity="0.70"/>
  <text x="88" y="432" font-family="'Courier New', Courier, monospace" font-size="12" fill="#131110" fill-opacity="0.92">dh-order-status-sync-batch</text>
  <text x="88" y="452" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="12" fill="#131110" fill-opacity="0.74">tracking number, carrier, delivery date &#8594; portal</text>
  <text x="504" y="440" text-anchor="end" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="15" font-weight="800" fill="#131110" fill-opacity="0.92">every 5 min</text>

  <line x1="66" y1="490" x2="524" y2="490" stroke="#F75A41" stroke-opacity="0.40" stroke-width="1"/>
  <text x="66" y="516" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="15" font-weight="700" fill="#131110" fill-opacity="0.92">Three systems. Zero manual handoffs.</text>
  <text x="66" y="538" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="13" fill="#131110" fill-opacity="0.74">A portal, a Salesforce org and a logistics platform that had never spoken.</text>

  <!-- ══════════════════════════════════════════════ -->
  <!-- RIGHT: the one field that stopped the re-firing -->
  <!-- ══════════════════════════════════════════════ -->

  <text x="618" y="64" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="15" font-weight="700" fill="#131110" fill-opacity="0.68" letter-spacing="0.14em">THE TIMESTAMP THAT KEPT RE-FIRING</text>

  <!-- before -->
  <rect x="618" y="90" width="542" height="112" rx="12" fill="#FFFFFF" stroke="#131110" stroke-opacity="0.15" stroke-width="1.5"/>
  <rect x="642" y="110" width="46" height="20" rx="10" fill="#131110" fill-opacity="0.10"/>
  <text x="652" y="124" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="10" font-weight="700" fill="#131110" fill-opacity="0.74" letter-spacing="0.08em">v1.0</text>
  <text x="642" y="158" font-family="'Courier New', Courier, monospace" font-size="14" fill="#131110" fill-opacity="0.92">WHERE LastModifiedDate &gt; :lastRun</text>
  <text x="642" y="182" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="13" fill="#131110" fill-opacity="0.74">A comment, a field touched by anything else &#8212; re-processed.</text>

  <line x1="889" y1="202" x2="889" y2="226" stroke="#F75A41" stroke-opacity="0.70" stroke-width="2"/>
  <path d="M889 230 L885 222 L893 222 Z" fill="#F75A41" fill-opacity="0.70"/>

  <!-- after -->
  <rect x="618" y="230" width="542" height="112" rx="12" fill="#FFFFFF" stroke="#F75A41" stroke-opacity="0.50" stroke-width="1.5"/>
  <rect x="642" y="250" width="60" height="20" rx="10" fill="#F75A41" fill-opacity="0.16"/>
  <text x="652" y="264" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="10" font-weight="700" fill="#131110" fill-opacity="0.92" letter-spacing="0.08em">v1.1.0</text>
  <text x="642" y="298" font-family="'Courier New', Courier, monospace" font-size="14" fill="#131110" fill-opacity="0.92">WHERE Integration_Timestamp__c &gt; :lastRun</text>
  <text x="642" y="322" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="13" fill="#131110" fill-opacity="0.74">Only the integration writes it. Nothing else touches it.</text>

  <!-- the numbers that matter -->
  <g font-family="Archivo, Outfit, system-ui, sans-serif">
    <rect x="618" y="360" width="172" height="84" rx="12" fill="#FFFFFF" stroke="#131110" stroke-opacity="0.15" stroke-width="1.5"/>
    <text x="640" y="408" font-size="34" font-weight="900" fill="#131110" fill-opacity="0.92">4</text>
    <text x="640" y="430" font-size="10" font-weight="700" fill="#131110" fill-opacity="0.68" letter-spacing="0.1em">CASE FLAGS, ONE SYNC</text>

    <rect x="803" y="360" width="172" height="84" rx="12" fill="#FFFFFF" stroke="#131110" stroke-opacity="0.15" stroke-width="1.5"/>
    <text x="825" y="408" font-size="34" font-weight="900" fill="#131110" fill-opacity="0.92">100</text>
    <text x="825" y="430" font-size="10" font-weight="700" fill="#131110" fill-opacity="0.68" letter-spacing="0.1em">PER PATCH BATCH</text>

    <rect x="988" y="360" width="172" height="84" rx="12" fill="#FFFFFF" stroke="#131110" stroke-opacity="0.15" stroke-width="1.5"/>
    <text x="1010" y="408" font-size="34" font-weight="900" fill="#131110" fill-opacity="0.92">0</text>
    <text x="1010" y="430" font-size="10" font-weight="700" fill="#131110" fill-opacity="0.68" letter-spacing="0.1em">FALSE RE-TRIGGERS</text>
  </g>

  <!-- the rule that made it safe -->
  <rect x="618" y="458" width="542" height="100" rx="12" fill="#131110" fill-opacity="0.92"/>
  <rect x="642" y="476" width="164" height="20" rx="10" fill="#F7F4F2" fill-opacity="0.16"/>
  <text x="654" y="490" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#F7F4F2" fill-opacity="0.90" letter-spacing="0.12em">BEFORE EVERY UPSERT</text>
  <text x="642" y="522" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="17" font-weight="700" fill="#F7F4F2" fill-opacity="0.95">Filter to the Member RecordType.</text>
  <text x="642" y="546" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="14" fill="#F7F4F2" fill-opacity="0.80">Wrong-type Accounts do not come back.</text>
</svg>
