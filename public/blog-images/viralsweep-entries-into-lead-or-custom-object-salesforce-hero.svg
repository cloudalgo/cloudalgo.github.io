<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" aria-hidden="true">
  <rect width="1200" height="600" fill="#F7F4F2"/>
  <line x1="578" y1="40" x2="578" y2="560" stroke="#F75A41" stroke-opacity="0.34" stroke-width="1"/>

  <!-- LEFT: three routes -->
  <text x="38" y="60" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="15" font-weight="700" fill="#131110" fill-opacity="0.68" letter-spacing="0.14em">THREE ROUTES ACROSS</text>

  <rect x="38" y="78" width="514" height="374" rx="12" fill="#FFFFFF" stroke="#131110" stroke-opacity="0.15" stroke-width="1.5"/>

  <g font-family="Archivo, Outfit, system-ui, sans-serif">
    <rect x="66" y="104" width="458" height="94" rx="10" fill="#131110" fill-opacity="0.06"/>
    <rect x="66" y="104" width="4" height="94" rx="2" fill="#131110" fill-opacity="0.14"/>
    <text x="90" y="132" font-size="18" font-weight="700" fill="#131110" fill-opacity="0.92">Zapier</text>
    <text x="504" y="132" text-anchor="end" font-size="12" font-weight="700" letter-spacing="0.06em" fill="#131110" fill-opacity="0.68">NO CODE</text>
    <text x="90" y="156" font-size="13" fill="#131110" fill-opacity="0.74">Fastest to stand up. Fields map cleanly or not at all.</text>
    <text x="90" y="180" font-size="13" fill="#131110" fill-opacity="0.74">Priced per task &#8212; a campaign that spikes costs more than planned.</text>

    <rect x="66" y="212" width="458" height="94" rx="10" fill="#131110" fill-opacity="0.06"/>
    <rect x="66" y="212" width="4" height="94" rx="2" fill="#131110" fill-opacity="0.14"/>
    <text x="90" y="240" font-size="18" font-weight="700" fill="#131110" fill-opacity="0.92">Webhooks</text>
    <text x="504" y="240" text-anchor="end" font-size="12" font-weight="700" letter-spacing="0.06em" fill="#131110" fill-opacity="0.68">AN ENDPOINT YOU OWN</text>
    <text x="90" y="264" font-size="13" fill="#131110" fill-opacity="0.74">Posted the moment an entry is submitted. No per-task cost.</text>
    <text x="90" y="288" font-size="13" fill="#131110" fill-opacity="0.74">You decide what happens on failure. Usually right for a long run.</text>

    <rect x="66" y="320" width="458" height="94" rx="10" fill="#F75A41" fill-opacity="0.10"/>
    <rect x="66" y="320" width="4" height="94" rx="2" fill="#F75A41" fill-opacity="0.70"/>
    <text x="90" y="348" font-size="18" font-weight="700" fill="#131110" fill-opacity="0.92">Custom Apex</text>
    <text x="504" y="348" text-anchor="end" font-size="12" font-weight="700" letter-spacing="0.06em" fill="#131110" fill-opacity="0.92">ONLY IF WORK IS NEEDED</text>
    <text x="90" y="372" font-size="13" fill="#131110" fill-opacity="0.80">Dedupe against Leads and Contacts, match to an Account,</text>
    <text x="90" y="396" font-size="13" fill="#131110" fill-opacity="0.80">assign by rules Salesforce cannot express, write a custom object.</text>
  </g>

  <line x1="66" y1="482" x2="524" y2="482" stroke="#F75A41" stroke-opacity="0.40" stroke-width="1"/>
  <text x="66" y="510" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="17" font-weight="700" fill="#131110" fill-opacity="0.92">Does an entry become a Lead as it stands?</text>
  <text x="66" y="536" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="15" fill="#131110" fill-opacity="0.80">If it does, do not write Apex.</text>

  <!-- RIGHT: what stops the record landing, and what bites later -->
  <text x="618" y="64" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="15" font-weight="700" fill="#131110" fill-opacity="0.68" letter-spacing="0.14em">REQUIRED ON LEAD, ABSENT ON THE FORM</text>

  <rect x="618" y="84" width="542" height="104" rx="12" fill="#FFFFFF" stroke="#F75A41" stroke-opacity="0.50" stroke-width="1.5"/>
  <g font-family="'Courier New', Courier, monospace" font-size="16">
    <text x="642" y="122" font-weight="700" fill="#131110" fill-opacity="0.92">LastName</text>
    <text x="1136" y="122" text-anchor="end" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="13" fill="#131110" fill-opacity="0.74">the form asks for a first name</text>
    <text x="642" y="152" font-weight="700" fill="#131110" fill-opacity="0.92">Company</text>
    <text x="1136" y="152" text-anchor="end" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="13" fill="#131110" fill-opacity="0.74">the form never asks at all</text>
  </g>
  <text x="642" y="176" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="13" fill="#131110" fill-opacity="0.80">Unfilled, validation fails on every single record.</text>

  <text x="618" y="228" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="15" font-weight="700" fill="#131110" fill-opacity="0.68" letter-spacing="0.14em">THREE THINGS THAT BITE AFTERWARDS</text>

  <g font-family="Archivo, Outfit, system-ui, sans-serif">
    <rect x="618" y="252" width="4" height="48" rx="2" fill="#F75A41" fill-opacity="0.70"/>
    <text x="640" y="272" font-size="18" font-weight="600" fill="#131110" fill-opacity="0.92">Duplicates</text>
    <text x="640" y="292" font-size="13" fill="#131110" fill-opacity="0.74">An entrant who is already a Contact still lands as a second Lead</text>
    <text x="1160" y="272" text-anchor="end" font-size="12" font-weight="700" letter-spacing="0.06em" fill="#131110" fill-opacity="0.68">MATCHING</text>

    <rect x="618" y="320" width="4" height="48" rx="2" fill="#F75A41" fill-opacity="0.58"/>
    <text x="640" y="340" font-size="18" font-weight="600" fill="#131110" fill-opacity="0.92">Volume, in bursts</text>
    <text x="640" y="360" font-size="13" fill="#131110" fill-opacity="0.74">A task count through Zapier; a governor limit through Apex</text>
    <text x="1160" y="340" text-anchor="end" font-size="12" font-weight="700" letter-spacing="0.06em" fill="#131110" fill-opacity="0.68">BULKIFY</text>

    <rect x="618" y="388" width="4" height="48" rx="2" fill="#F75A41" fill-opacity="0.46"/>
    <text x="640" y="408" font-size="18" font-weight="600" fill="#131110" fill-opacity="0.92">Consent</text>
    <text x="640" y="428" font-size="13" fill="#131110" fill-opacity="0.74">Capture it on the entry form and map it to a field of its own</text>
    <text x="1160" y="408" text-anchor="end" font-size="12" font-weight="700" letter-spacing="0.06em" fill="#131110" fill-opacity="0.68">COMPLIANCE</text>
  </g>

  <rect x="618" y="462" width="542" height="96" rx="12" fill="#131110" fill-opacity="0.92"/>
  <rect x="642" y="480" width="196" height="20" rx="10" fill="#F7F4F2" fill-opacity="0.16"/>
  <text x="654" y="494" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#F7F4F2" fill-opacity="0.90" letter-spacing="0.12em">SWEEPSTAKES &#8800; MARKETING</text>
  <text x="642" y="526" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="17" font-weight="700" fill="#F7F4F2" fill-opacity="0.95">Entering a contest is not opting into email.</text>
  <text x="642" y="548" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="14" fill="#F7F4F2" fill-opacity="0.80">Otherwise you inherit a compliance problem along with the leads.</text>
</svg>
