  <!-- RIGHT: what has to change                     -->
  <!-- ══════════════════════════════════════════════ -->

  <text x="668" y="96" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="15" font-weight="700" letter-spacing="0.14em" fill="#131110" fill-opacity="0.74">login() CALLERS · RETIRES SUMMER &#8217;27</text>

  <g font-family="Archivo, Outfit, system-ui, sans-serif">
    <!-- row 1 -->
    <rect x="668" y="128" width="4" height="40" rx="2" fill="#F75A41" fill-opacity="0.70"/>
    <text x="688" y="146" font-size="18" font-weight="600" fill="#131110">Boomi order sync</text>
    <text x="1160" y="146" text-anchor="end" font-size="12" font-weight="700" letter-spacing="0.06em" fill="#131110" fill-opacity="0.68">SOAP PARTNER</text>
    <text x="688" y="164" font-size="13" fill="#131110" fill-opacity="0.74">Production · owner unknown</text>

    <!-- row 2 -->
    <rect x="668" y="188" width="4" height="40" rx="2" fill="#F75A41" fill-opacity="0.70"/>
    <text x="688" y="206" font-size="18" font-weight="600" fill="#131110">Nightly WSC export</text>
    <text x="1160" y="206" text-anchor="end" font-size="12" font-weight="700" letter-spacing="0.06em" fill="#131110" fill-opacity="0.68">SOAP ENTERPRISE</text>
    <text x="688" y="224" font-size="13" fill="#131110" fill-opacity="0.74">Password + security token in config</text>

    <!-- row 3 -->
    <rect x="668" y="248" width="4" height="40" rx="2" fill="#F75A41" fill-opacity="0.58"/>
    <text x="688" y="266" font-size="18" font-weight="600" fill="#131110">Ant deploy pipeline</text>
    <text x="1160" y="266" text-anchor="end" font-size="12" font-weight="700" letter-spacing="0.06em" fill="#131110" fill-opacity="0.68">CI</text>
    <text x="688" y="284" font-size="13" fill="#131110" fill-opacity="0.74">Replace with sf CLI + JWT</text>

    <!-- row 4 -->
    <rect x="668" y="308" width="4" height="40" rx="2" fill="#F75A41" fill-opacity="0.58"/>
    <text x="688" y="326" font-size="18" font-weight="600" fill="#131110">Data Loader on a laptop</text>
    <text x="1160" y="326" text-anchor="end" font-size="12" font-weight="700" letter-spacing="0.06em" fill="#131110" fill-opacity="0.68">SOAP PARTNER</text>
    <text x="688" y="344" font-size="13" fill="#131110" fill-opacity="0.74">Weekly export · not in any diagram</text>

    <!-- row 5 -->
    <rect x="668" y="368" width="4" height="40" rx="2" fill="#F75A41" fill-opacity="0.58"/>
    <text x="688" y="386" font-size="18" font-weight="600" fill="#131110">Reporting connector</text>
    <text x="1160" y="386" text-anchor="end" font-size="12" font-weight="700" letter-spacing="0.06em" fill="#131110" fill-opacity="0.68">SOAP PARTNER</text>
    <text x="688" y="404" font-size="13" fill="#131110" fill-opacity="0.74">Partner-built, 2019 · no contact</text>

    <!-- row 6 -->
    <rect x="668" y="428" width="4" height="40" rx="2" fill="#F75A41" fill-opacity="0.46"/>
    <text x="688" y="446" font-size="18" font-weight="600" fill="#131110" fill-opacity="0.80">(unidentified)</text>
    <text x="1160" y="446" text-anchor="end" font-size="12" font-weight="700" letter-spacing="0.06em" fill="#131110" fill-opacity="0.68">v31.0</text>
    <text x="688" y="464" font-size="13" fill="#131110" fill-opacity="0.74">12 calls in 30 days · source IP only</text>
  </g>

  <!-- Footer: the fix -->
  <line x1="668" y1="500" x2="1160" y2="500" stroke="#F75A41" stroke-opacity="0.34" stroke-width="1"/>
  <text x="668" y="528" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="0.1em" fill="#131110" fill-opacity="0.68">THE FIX</text>
  <text x="668" y="552" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="17" font-weight="500" fill="#131110" fill-opacity="0.92">External Client App · OAuth 2.0 JWT bearer</text>
</svg>
