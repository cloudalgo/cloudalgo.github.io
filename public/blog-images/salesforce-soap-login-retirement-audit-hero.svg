    <text x="62" y="234">CLIENT_NAME</text>
    <text x="392" y="234">API</text>
    <text x="528" y="234" text-anchor="end">CALLS</text>
  </g>

  <!-- Output rows -->
  <g font-family="'Courier New', Courier, monospace" font-size="13" fill="#131110">
    <text x="62" y="262" fill-opacity="0.85">Boomi AtomSphere</text>
    <text x="392" y="262" fill-opacity="0.55">38.0</text>
    <text x="528" y="262" text-anchor="end" fill-opacity="0.85">4,182</text>

    <text x="62" y="290" fill-opacity="0.85">WSC / JavaClient</text>
    <text x="392" y="290" fill-opacity="0.55">40.0</text>
    <text x="528" y="290" text-anchor="end" fill-opacity="0.85">916</text>

    <text x="62" y="318" fill-opacity="0.85">python-simple-salesforce</text>
    <text x="392" y="318" fill-opacity="0.55">58.0</text>
    <text x="528" y="318" text-anchor="end" fill-opacity="0.85">1,027</text>

    <text x="62" y="346" fill-opacity="0.85">DataLoader CLI</text>
    <text x="392" y="346" fill-opacity="0.55">46.0</text>
    <text x="528" y="346" text-anchor="end" fill-opacity="0.85">310</text>

    <text x="62" y="374" fill-opacity="0.85">Ant Migration Tool</text>
    <text x="392" y="374" fill-opacity="0.55">52.0</text>
    <text x="528" y="374" text-anchor="end" fill-opacity="0.85">44</text>
  </g>

  <!-- Highlighted unknown row -->
  <rect x="52" y="386" width="486" height="30" rx="4" fill="#131110" fill-opacity="0.09"/>
  <rect x="52" y="386" width="3" height="30" rx="1.5" fill="#131110" fill-opacity="0.92"/>
  <g font-family="'Courier New', Courier, monospace" font-size="13" fill="#131110">
    <text x="66" y="406" fill-opacity="0.9">(unidentified)</text>
    <text x="392" y="406" fill-opacity="0.55">31.0</text>
    <text x="528" y="406" text-anchor="end" fill-opacity="0.9">12</text>
  </g>

  <line x1="62" y1="440" x2="528" y2="440" stroke="#F75A41" stroke-opacity="0.34" stroke-width="1"/>

  <g font-family="'Courier New', Courier, monospace" font-size="13" fill="#131110">
    <text x="62" y="470" fill-opacity="0.45"># 6 clients on SOAP login()</text>
    <text x="62" y="492" fill-opacity="0.45"># 0 on OAuth</text>
    <text x="62" y="522"><tspan fill-opacity="0.35">$</tspan><tspan fill-opacity="0.85"> _</tspan></text>
  </g>

