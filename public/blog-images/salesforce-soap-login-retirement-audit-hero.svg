<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" aria-hidden="true">
  <!-- Background -->
  <rect width="1200" height="600" fill="#F7F4F2"/>

  <!-- Vertical separator -->
  <line x1="578" y1="40" x2="578" y2="560" stroke="#F75A41" stroke-opacity="0.34" stroke-width="1"/>

  <!-- ══════════════════════════════════════════════ -->
  <!-- LEFT: the audit query                         -->
  <!-- ══════════════════════════════════════════════ -->

  <rect x="38" y="40" width="514" height="520" rx="12" fill="#FFFFFF" stroke="#131110" stroke-opacity="0.15" stroke-width="1.5"/>

  <!-- Window chrome -->
  <circle cx="64" cy="68" r="5" fill="#131110" fill-opacity="0.21"/>
  <circle cx="82" cy="68" r="5" fill="#131110" fill-opacity="0.21"/>
  <circle cx="100" cy="68" r="5" fill="#131110" fill-opacity="0.21"/>
  <text x="295" y="73" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="12.5" font-weight="700" letter-spacing="0.04em" fill="#131110" fill-opacity="0.68">EventLogFile — ApiTotalUsage</text>
  <line x1="38" y1="92" x2="552" y2="92" stroke="#F75A41" stroke-opacity="0.34" stroke-width="1"/>

  <!-- Command -->
  <g font-family="'Courier New', Courier, monospace" font-size="13" fill="#131110">
    <text x="62" y="124"><tspan fill-opacity="0.35">$</tspan><tspan fill-opacity="0.88"> sf data query \</tspan></text>
    <text x="84" y="146" fill-opacity="0.88">-q "SELECT LogFile, LogDate</text>
    <text x="106" y="166" fill-opacity="0.88">FROM EventLogFile WHERE</text>
    <text x="106" y="186" fill-opacity="0.88">EventType = 'ApiTotalUsage'"</text>
  </g>

  <line x1="62" y1="210" x2="528" y2="210" stroke="#F75A41" stroke-opacity="0.34" stroke-width="1"/>

  <!-- Output header -->
