<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" aria-hidden="true">
  <!-- Background -->
  <rect width="1200" height="600" fill="#F7F4F2"/>

  <!-- Vertical separator -->
  <line x1="578" y1="40" x2="578" y2="560" stroke="#F75A41" stroke-opacity="0.34" stroke-width="1"/>

  <!-- ══════════════════════════════════════════════ -->
  <!-- LEFT: the deploy that fails, and the fix       -->
  <!-- ══════════════════════════════════════════════ -->

  <rect x="38" y="40" width="514" height="520" rx="12" fill="#FFFFFF" stroke="#131110" stroke-opacity="0.15" stroke-width="1.5"/>

  <!-- Window chrome -->
  <circle cx="64" cy="68" r="5" fill="#131110" fill-opacity="0.21"/>
  <circle cx="82" cy="68" r="5" fill="#131110" fill-opacity="0.21"/>
  <circle cx="100" cy="68" r="5" fill="#131110" fill-opacity="0.21"/>
  <text x="300" y="73" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="12.5" font-weight="700" letter-spacing="0.04em" fill="#131110" fill-opacity="0.68">mule 4.6.0 · jdk 17</text>
  <line x1="38" y1="92" x2="552" y2="92" stroke="#F75A41" stroke-opacity="0.34" stroke-width="1"/>

  <!-- The deploy failure -->
  <text x="62" y="122" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="0.12em" fill="#131110" fill-opacity="0.68">DEPLOY, AFTER THE JDK FLIP</text>

  <rect x="52" y="136" width="486" height="88" rx="6" fill="#131110" fill-opacity="0.90"/>
  <text x="68" y="162" font-family="'Courier New', Courier, monospace" font-size="12.5" fill="#F7F4F2" fill-opacity="0.95">Extension 'module-error-handler-plugin'</text>
  <text x="68" y="182" font-family="'Courier New', Courier, monospace" font-size="12.5" fill="#F7F4F2" fill-opacity="0.95">does not support Java 17.</text>
  <text x="68" y="206" font-family="'Courier New', Courier, monospace" font-size="12.5" fill="#F7F4F2" fill-opacity="0.78">Supported versions are: [1.8, 11]</text>

  <!-- Why -->
  <text x="62" y="252" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="0.12em" fill="#131110" fill-opacity="0.68">NOBODY DECLARED ANYTHING</text>
  <text x="62" y="276" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="14" fill="#131110" fill-opacity="0.80">No annotation means Java 8 and 11 only.</text>
  <text x="62" y="296" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="14" fill="#131110" fill-opacity="0.80">The default is not unknown. The default is no.</text>

  <text x="62" y="328" font-family="'Courier New', Courier, monospace" font-size="12.5" fill="#131110" fill-opacity="0.88">@Extension(name = "Database")</text>

  <rect x="52" y="338" width="486" height="28" rx="4" fill="#131110" fill-opacity="0.06"/>
  <rect x="52" y="338" width="4" height="28" rx="2" fill="#F75A41" fill-opacity="0.70"/>
  <text x="66" y="357" font-family="'Courier New', Courier, monospace" font-size="12.5" font-weight="700" fill="#131110" fill-opacity="0.92">@JavaVersionSupport({JAVA_8, JAVA_11, JAVA_17})</text>

  <text x="62" y="386" font-family="'Courier New', Courier, monospace" font-size="12.5" fill="#131110" fill-opacity="0.88">public class DatabaseConnector {</text>

  <line x1="62" y1="410" x2="528" y2="410" stroke="#F75A41" stroke-opacity="0.34" stroke-width="1"/>

  <!-- And the build -->
  <text x="62" y="436" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="0.12em" fill="#131110" fill-opacity="0.68">AND THE BUILD, MEANWHILE</text>
  <text x="62" y="464" font-family="'Courier New', Courier, monospace" font-size="13.5" fill="#131110" fill-opacity="0.74">$ mvn clean package</text>
  <text x="62" y="488" font-family="'Courier New', Courier, monospace" font-size="15" font-weight="700" fill="#131110" fill-opacity="0.92">BUILD SUCCESS</text>
  <text x="62" y="518" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="14" font-weight="600" fill="#131110" fill-opacity="0.80">Same artefact. Still compiled to Java 8.</text>
  <text x="62" y="540" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="14" font-weight="600" fill="#131110" fill-opacity="0.80">Nothing here fails until deploy.</text>

  <!-- ══════════════════════════════════════════════ -->
  <!-- RIGHT: the support matrix, and the closing lane -->
  <!-- ══════════════════════════════════════════════ -->

  <text x="668" y="80" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="15" font-weight="700" letter-spacing="0.14em" fill="#131110" fill-opacity="0.74">THE ONLY BAND THAT RUNS BOTH</text>
  <line x1="668" y1="98" x2="1160" y2="98" stroke="#F75A41" stroke-opacity="0.34" stroke-width="1"/>

  <g font-family="Archivo, Outfit, system-ui, sans-serif">
    <!-- 4.5 Edge -->
    <rect x="668" y="114" width="4" height="34" rx="2" fill="#131110" fill-opacity="0.14"/>
    <text x="690" y="132" font-size="17" font-weight="600" fill="#131110" fill-opacity="0.80">4.5 Edge</text>
    <text x="690" y="150" font-size="13" fill="#131110" fill-opacity="0.74">No route to 17 from here</text>
    <text x="1160" y="136" text-anchor="end" font-size="17" font-weight="700" fill="#131110" fill-opacity="0.80">8, 11</text>

    <!-- 4.6 LTS -->
    <rect x="668" y="168" width="4" height="34" rx="2" fill="#F75A41" fill-opacity="0.70"/>
    <text x="690" y="186" font-size="17" font-weight="600" fill="#131110" fill-opacity="0.92">4.6 LTS</text>
    <text x="690" y="204" font-size="13" fill="#131110" fill-opacity="0.74">Standard support for 8 and 11 ended in August</text>
    <text x="1160" y="190" text-anchor="end" font-size="17" font-weight="700" fill="#131110" fill-opacity="0.92">8, 11, 17</text>

    <!-- 4.7 Edge -->
    <rect x="668" y="222" width="4" height="34" rx="2" fill="#F75A41" fill-opacity="0.58"/>
    <text x="690" y="240" font-size="17" font-weight="600" fill="#131110" fill-opacity="0.92">4.7 Edge</text>
    <text x="690" y="258" font-size="13" fill="#131110" fill-opacity="0.74">Change the runtime, hold the JDK still</text>
    <text x="1160" y="244" text-anchor="end" font-size="17" font-weight="700" fill="#131110" fill-opacity="0.92">8, 11, 17</text>

    <!-- 4.8 Edge -->
    <rect x="668" y="276" width="4" height="34" rx="2" fill="#F75A41" fill-opacity="0.46"/>
    <text x="690" y="294" font-size="17" font-weight="600" fill="#131110" fill-opacity="0.92">4.8 Edge</text>
    <text x="690" y="312" font-size="13" fill="#131110" fill-opacity="0.74">Then change the JDK, hold the runtime still</text>
    <text x="1160" y="298" text-anchor="end" font-size="17" font-weight="700" fill="#131110" fill-opacity="0.92">8, 11, 17</text>

    <!-- 4.9 LTS -->
    <rect x="668" y="330" width="4" height="34" rx="2" fill="#131110" fill-opacity="0.14"/>
    <text x="690" y="348" font-size="17" font-weight="600" fill="#131110" fill-opacity="0.80">4.9 LTS and after</text>
    <text x="690" y="366" font-size="13" fill="#131110" fill-opacity="0.74">Nothing left to switch</text>
    <text x="1160" y="352" text-anchor="end" font-size="17" font-weight="700" fill="#131110" fill-opacity="0.80">17</text>
  </g>

  <line x1="668" y1="392" x2="1160" y2="392" stroke="#F75A41" stroke-opacity="0.34" stroke-width="1"/>

  <text x="668" y="418" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="0.12em" fill="#131110" fill-opacity="0.68">WHAT THE DATE IS ACTUALLY ABOUT</text>

  <text x="668" y="486" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="62" font-weight="900" fill="#F75A41" fill-opacity="1">FEB 2027</text>
  <text x="668" y="516" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="16" font-weight="600" fill="#131110" fill-opacity="0.80">Extended support for 8 and 11 on 4.6 LTS ends.</text>
  <text x="668" y="538" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="16" font-weight="600" fill="#131110" fill-opacity="0.80">The overlap band closes with it, and after that</text>
  <text x="668" y="560" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="16" font-weight="600" fill="#131110" fill-opacity="0.80">both switches move at once.</text>
</svg>
