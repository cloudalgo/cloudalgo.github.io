<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" aria-hidden="true">
  <!-- Background -->
  <rect width="1200" height="600" fill="#F7F4F2"/>

  <!-- Vertical separator -->
  <line x1="578" y1="40" x2="578" y2="560" stroke="#F75A41" stroke-opacity="0.34" stroke-width="1"/>

  <!-- ══════════════════════════════════════════════ -->
  <!-- LEFT: three applications, four flows            -->
  <!-- ══════════════════════════════════════════════ -->

  <text x="38" y="60" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="15" font-weight="700" fill="#131110" fill-opacity="0.68" letter-spacing="0.14em">THREE APPLICATIONS, FOUR FLOWS</text>

  <rect x="38" y="78" width="514" height="482" rx="12" fill="#FFFFFF" stroke="#131110" stroke-opacity="0.15" stroke-width="1.5"/>

  <!-- 1 : customer -->
  <rect x="66" y="100" width="458" height="74" rx="10" fill="#131110" fill-opacity="0.07"/>
  <text x="88" y="126" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="15" font-weight="700" fill="#131110" fill-opacity="0.92">Customer sync</text>
  <text x="502" y="126" text-anchor="end" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="13" font-weight="800" fill="#131110" fill-opacity="0.92">real-time</text>
  <text x="88" y="152" font-family="'Courier New', Courier, monospace" font-size="11" fill="#131110" fill-opacity="0.74">AccountsEvent__e</text>
  <text x="502" y="152" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="10" fill="#131110" fill-opacity="0.68">Salesforce &#8594; NetSuite</text>

  <!-- 2 : order -->
  <rect x="66" y="196" width="458" height="74" rx="10" fill="#131110" fill-opacity="0.07"/>
  <text x="88" y="222" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="15" font-weight="700" fill="#131110" fill-opacity="0.92">Order sync</text>
  <text x="502" y="222" text-anchor="end" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="13" font-weight="800" fill="#131110" fill-opacity="0.92">real-time</text>
  <text x="88" y="248" font-family="'Courier New', Courier, monospace" font-size="11" fill="#131110" fill-opacity="0.74">Create_NS_Order__e &#183; SOAP Sales Order</text>
  <text x="502" y="248" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="10" fill="#131110" fill-opacity="0.68">Salesforce &#8594; NetSuite</text>

  <!-- 3 : the one that runs on a clock -->
  <rect x="66" y="292" width="458" height="74" rx="10" fill="#F75A41" fill-opacity="0.10"/>
  <rect x="66" y="292" width="4" height="74" rx="2" fill="#F75A41" fill-opacity="0.70"/>
  <text x="88" y="318" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="15" font-weight="700" fill="#131110" fill-opacity="0.92">Invoice and refund sync</text>
  <text x="502" y="318" text-anchor="end" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="13" font-weight="800" fill="#131110" fill-opacity="0.92">every 15 min</text>
  <text x="88" y="344" font-family="'Courier New', Courier, monospace" font-size="11" fill="#131110" fill-opacity="0.74">watermark &#183; batches of 50</text>
  <text x="502" y="344" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="10" fill="#131110" fill-opacity="0.68">NetSuite &#8594; Salesforce</text>

  <!-- 4 : payment -->
  <rect x="66" y="388" width="458" height="74" rx="10" fill="#131110" fill-opacity="0.07"/>
  <text x="88" y="414" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="15" font-weight="700" fill="#131110" fill-opacity="0.92">Payment sync</text>
  <text x="502" y="414" text-anchor="end" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="13" font-weight="800" fill="#131110" fill-opacity="0.92">seconds</text>
  <text x="88" y="440" font-family="'Courier New', Courier, monospace" font-size="11" fill="#131110" fill-opacity="0.74">Payment_and_Refund_Event__e</text>
  <text x="502" y="440" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="10" fill="#131110" fill-opacity="0.68">Salesforce &#8594; NetSuite</text>

  <line x1="66" y1="492" x2="524" y2="492" stroke="#F75A41" stroke-opacity="0.40" stroke-width="1"/>
  <text x="66" y="518" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="15" font-weight="700" fill="#131110" fill-opacity="0.92">Zero manual order re-entry.</text>
  <text x="66" y="540" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="13" fill="#131110" fill-opacity="0.74">Nobody opens NetSuite and types the order again.</text>

  <!-- ══════════════════════════════════════════════ -->
  <!-- RIGHT: the decisions behind the shape           -->
  <!-- ══════════════════════════════════════════════ -->

  <text x="618" y="64" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="15" font-weight="700" fill="#131110" fill-opacity="0.68" letter-spacing="0.14em">DECISIONS WORTH EXPLAINING</text>

  <g font-family="Archivo, Outfit, system-ui, sans-serif">
    <rect x="618" y="102" width="4" height="50" rx="2" fill="#F75A41" fill-opacity="0.70"/>
    <text x="640" y="122" font-size="18" font-weight="600" fill="#131110" fill-opacity="0.92">Match the pattern to the data</text>
    <text x="640" y="144" font-size="13" fill="#131110" fill-opacity="0.74">Orders cannot wait for a poll; invoices do not need an event</text>
    <text x="1160" y="122" text-anchor="end" font-size="12" font-weight="700" letter-spacing="0.06em" fill="#131110" fill-opacity="0.68">SHAPE</text>

    <rect x="618" y="180" width="4" height="50" rx="2" fill="#F75A41" fill-opacity="0.70"/>
    <text x="640" y="200" font-size="18" font-weight="600" fill="#131110" fill-opacity="0.92">SOAP for Sales Orders, not REST</text>
    <text x="640" y="222" font-size="13" fill="#131110" fill-opacity="0.74">Nested item lists and conditional fields survive the XML path</text>
    <text x="1160" y="200" text-anchor="end" font-size="12" font-weight="700" letter-spacing="0.06em" fill="#131110" fill-opacity="0.68">NETSUITE</text>

    <rect x="618" y="258" width="4" height="50" rx="2" fill="#F75A41" fill-opacity="0.58"/>
    <text x="640" y="278" font-size="18" font-weight="600" fill="#131110" fill-opacity="0.92">A watermark, not a full table</text>
    <text x="640" y="300" font-size="13" fill="#131110" fill-opacity="0.74">Last run in Object Store, less two minutes for clock skew</text>
    <text x="1160" y="278" text-anchor="end" font-size="12" font-weight="700" letter-spacing="0.06em" fill="#131110" fill-opacity="0.68">SCHEDULER</text>

    <rect x="618" y="336" width="4" height="50" rx="2" fill="#F75A41" fill-opacity="0.46"/>
    <text x="640" y="356" font-size="18" font-weight="600" fill="#131110" fill-opacity="0.92">Every id written back both ways</text>
    <text x="640" y="378" font-size="13" fill="#131110" fill-opacity="0.74">A flow checks for the other system&#8217;s id before it creates</text>
    <text x="1160" y="356" text-anchor="end" font-size="12" font-weight="700" letter-spacing="0.06em" fill="#131110" fill-opacity="0.68">IDEMPOTENT</text>
  </g>

  <!-- Why Platform Events and not a callout -->
  <rect x="618" y="424" width="542" height="116" rx="12" fill="#131110" fill-opacity="0.92"/>
  <rect x="642" y="446" width="200" height="22" rx="11" fill="#F7F4F2" fill-opacity="0.16"/>
  <text x="656" y="461" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="10" font-weight="700" fill="#F7F4F2" fill-opacity="0.90" letter-spacing="0.12em">EVENTS, NOT A CALLOUT</text>
  <text x="642" y="497" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="19" font-weight="700" fill="#F7F4F2" fill-opacity="0.95">Salesforce publishes and moves on.</text>
  <text x="642" y="521" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="14" fill="#F7F4F2" fill-opacity="0.80">A slow NetSuite never becomes a slow Salesforce.</text>
</svg>
