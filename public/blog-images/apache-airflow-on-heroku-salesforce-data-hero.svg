<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" aria-hidden="true">
  <rect width="1200" height="600" fill="#F7F4F2"/>
  <line x1="578" y1="40" x2="578" y2="560" stroke="#F75A41" stroke-opacity="0.34" stroke-width="1"/>

  <!-- LEFT: the medallion stack, one Postgres -->
  <text x="38" y="60" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="15" font-weight="700" fill="#131110" fill-opacity="0.68" letter-spacing="0.14em">ONE POSTGRES, THREE LAYERS</text>

  <rect x="38" y="78" width="514" height="482" rx="12" fill="#FFFFFF" stroke="#131110" stroke-opacity="0.15" stroke-width="1.5"/>

  <g font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#131110" fill-opacity="0.74">
    <rect x="66" y="104" width="106" height="34" rx="8" fill="#131110" fill-opacity="0.06"/>
    <text x="119" y="126" text-anchor="middle">CRM</text>
    <rect x="184" y="104" width="106" height="34" rx="8" fill="#131110" fill-opacity="0.06"/>
    <text x="237" y="126" text-anchor="middle">billing</text>
    <rect x="302" y="104" width="106" height="34" rx="8" fill="#131110" fill-opacity="0.06"/>
    <text x="355" y="126" text-anchor="middle">warehouse</text>
    <rect x="420" y="104" width="104" height="34" rx="8" fill="#131110" fill-opacity="0.06"/>
    <text x="472" y="126" text-anchor="middle">&#183; &#183; &#183;</text>
  </g>
  <line x1="295" y1="138" x2="295" y2="162" stroke="#F75A41" stroke-opacity="0.70" stroke-width="2"/>
  <path d="M295 166 L291 158 L299 158 Z" fill="#F75A41" fill-opacity="0.70"/>

  <rect x="66" y="168" width="458" height="62" rx="10" fill="#131110" fill-opacity="0.06"/>
  <rect x="66" y="168" width="4" height="62" rx="2" fill="#131110" fill-opacity="0.14"/>
  <text x="90" y="194" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="16" font-weight="800" fill="#131110" fill-opacity="0.92">BRONZE</text>
  <text x="504" y="194" text-anchor="end" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.08em" fill="#131110" fill-opacity="0.68">APPEND-ONLY</text>
  <text x="90" y="216" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="13" fill="#131110" fill-opacity="0.74">Exactly as it arrived. One table per source. Never edited.</text>
  <line x1="295" y1="230" x2="295" y2="250" stroke="#F75A41" stroke-opacity="0.70" stroke-width="2"/>
  <path d="M295 254 L291 246 L299 246 Z" fill="#F75A41" fill-opacity="0.70"/>

  <rect x="66" y="256" width="458" height="62" rx="10" fill="#131110" fill-opacity="0.06"/>
  <rect x="66" y="256" width="4" height="62" rx="2" fill="#131110" fill-opacity="0.14"/>
  <text x="90" y="282" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="16" font-weight="800" fill="#131110" fill-opacity="0.92">SILVER</text>
  <text x="504" y="282" text-anchor="end" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.08em" fill="#131110" fill-opacity="0.68">QUARANTINED, NOT DROPPED</text>
  <text x="90" y="304" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="13" fill="#131110" fill-opacity="0.74">Types cast, duplicates collapsed, ids reconciled onto one key.</text>
  <line x1="295" y1="318" x2="295" y2="338" stroke="#F75A41" stroke-opacity="0.70" stroke-width="2"/>
  <path d="M295 342 L291 334 L299 334 Z" fill="#F75A41" fill-opacity="0.70"/>

  <rect x="66" y="344" width="458" height="62" rx="10" fill="#F75A41" fill-opacity="0.12" stroke="#F75A41" stroke-opacity="0.50" stroke-width="1.5"/>
  <rect x="66" y="344" width="4" height="62" rx="2" fill="#F75A41" fill-opacity="0.70"/>
  <text x="90" y="370" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="16" font-weight="800" fill="#131110" fill-opacity="0.92">GOLD</text>
  <text x="504" y="370" text-anchor="end" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.08em" fill="#131110" fill-opacity="0.92">THE ONLY LAYER CONNECT SEES</text>
  <text x="90" y="392" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="13" fill="#131110" fill-opacity="0.80">One table per Salesforce object, columns named for the fields.</text>
  <line x1="295" y1="406" x2="295" y2="426" stroke="#F75A41" stroke-opacity="0.70" stroke-width="2"/>
  <path d="M295 430 L291 422 L299 422 Z" fill="#F75A41" fill-opacity="0.70"/>

  <rect x="66" y="432" width="458" height="62" rx="10" fill="#131110" fill-opacity="0.06"/>
  <rect x="66" y="432" width="4" height="62" rx="2" fill="#131110" fill-opacity="0.14"/>
  <text x="90" y="458" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="16" font-weight="800" fill="#131110" fill-opacity="0.92">HEROKU CONNECT</text>
  <text x="504" y="458" text-anchor="end" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.08em" fill="#131110" fill-opacity="0.68">&#8594; SALESFORCE</text>
  <text x="90" y="480" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="13" fill="#131110" fill-opacity="0.74">Matched on an external id chosen before anything synced.</text>

  <line x1="66" y1="512" x2="524" y2="512" stroke="#F75A41" stroke-opacity="0.40" stroke-width="1"/>
  <text x="66" y="538" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="15" font-weight="700" fill="#131110" fill-opacity="0.92">The pipeline and the sync target, one DATABASE_URL apart.</text>

  <!-- RIGHT: what it buys, what it costs -->
  <text x="618" y="64" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="15" font-weight="700" fill="#131110" fill-opacity="0.68" letter-spacing="0.14em">WHAT THE LAYERING BUYS</text>

  <g font-family="Archivo, Outfit, system-ui, sans-serif">
    <rect x="618" y="88" width="4" height="48" rx="2" fill="#F75A41" fill-opacity="0.70"/>
    <text x="640" y="108" font-size="18" font-weight="600" fill="#131110" fill-opacity="0.92">Failures stay contained</text>
    <text x="640" y="128" font-size="13" fill="#131110" fill-opacity="0.74">A malformed feed breaks an ingestion task. Gold never gets written.</text>
    <text x="1160" y="108" text-anchor="end" font-size="12" font-weight="700" letter-spacing="0.06em" fill="#131110" fill-opacity="0.68">BLAST RADIUS</text>

    <rect x="618" y="156" width="4" height="48" rx="2" fill="#F75A41" fill-opacity="0.58"/>
    <text x="640" y="176" font-size="18" font-weight="600" fill="#131110" fill-opacity="0.92">Reprocessing is cheap</text>
    <text x="640" y="196" font-size="13" fill="#131110" fill-opacity="0.74">Fix the transformation and replay from bronze. No re-extracting.</text>
    <text x="1160" y="176" text-anchor="end" font-size="12" font-weight="700" letter-spacing="0.06em" fill="#131110" fill-opacity="0.68">REPLAY</text>

    <rect x="618" y="224" width="4" height="48" rx="2" fill="#F75A41" fill-opacity="0.46"/>
    <text x="640" y="244" font-size="18" font-weight="600" fill="#131110" fill-opacity="0.92">A wrong value is traceable</text>
    <text x="640" y="264" font-size="13" fill="#131110" fill-opacity="0.74">Walk the field back through gold, silver and bronze until it appears</text>
    <text x="1160" y="244" text-anchor="end" font-size="12" font-weight="700" letter-spacing="0.06em" fill="#131110" fill-opacity="0.68">PROVENANCE</text>
  </g>

  <text x="618" y="324" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="15" font-weight="700" fill="#131110" fill-opacity="0.68" letter-spacing="0.14em">BUDGET FOR MORE THAN ONE DYNO</text>

  <rect x="618" y="342" width="542" height="86" rx="12" fill="#FFFFFF" stroke="#131110" stroke-opacity="0.15" stroke-width="1.5"/>
  <g font-family="'Courier New', Courier, monospace" font-size="14" fill="#131110" fill-opacity="0.86">
    <text x="642" y="374">scheduler</text>
    <text x="782" y="374">webserver</text>
    <text x="922" y="374" fill-opacity="0.62">workers</text>
  </g>
  <text x="642" y="402" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="13" fill="#131110" fill-opacity="0.80">Separate process types &#8212; and workers too, once you move off the local executor.</text>

  <rect x="618" y="452" width="542" height="106" rx="12" fill="#131110" fill-opacity="0.92"/>
  <rect x="642" y="470" width="146" height="20" rx="10" fill="#F7F4F2" fill-opacity="0.16"/>
  <text x="654" y="484" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#F7F4F2" fill-opacity="0.90" letter-spacing="0.12em">THE REAL TRADEOFF</text>
  <text x="642" y="516" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="17" font-weight="700" fill="#F7F4F2" fill-opacity="0.95">Three copies of the data, and more pipeline code.</text>
  <text x="642" y="542" font-family="Archivo, Outfit, system-ui, sans-serif" font-size="14" fill="#F7F4F2" fill-opacity="0.80">Overkill on one clean source. It starts paying where sources disagree.</text>
</svg>
