# Daily topic radar for the CloudAlgo Journal.
#
# Runs every weekday at 02:30 UTC (08:00 IST), researches what is new in the
# areas CloudAlgo works in, and opens a GitHub issue with five candidate posts.
# It publishes nothing. A human picks one by commenting "/write N" on that
# issue, which triggers journal-write.yml.
#
# Silence is a valid outcome: if nobody comments, nothing is published.
name: Journal topic radar

on:
  schedule:
    # 02:30 UTC = 08:00 IST, Monday through Friday.
    - cron: "30 2 * * 1-5"
  workflow_dispatch:

concurrency:
  group: journal-radar
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are running the daily topic radar for the CloudAlgo Journal.

            First, read and follow these files in the checked-out repository.
            They are the authoritative instructions for this task:
              - .claude/skills/cloudalgo-topic-radar/SKILL.md
              - .claude/skills/cloudalgo-voice/SKILL.md

            Step 1. Build the brief. Run this first, before anything else:

              node scripts/radar-brief.mjs --hours 24

            It fetches every feed in scripts/radar-feeds.json, keeps only
            entries whose real publication date falls inside the window, lists
            every candidate proposed in the last 45 days, and computes a burned
            list of topics already proposed two or more times.

            You work from that output. Not from memory, not from what you know
            about these platforms, not from a general sense of what matters in
            the Salesforce world. If an item is not in the brief, it is not a
            candidate today.

            Step 2. The recency rule, which is the whole point.

            Every candidate must anchor to a specific item in the brief's
            primary window, and you must quote that item's timestamp in the
            "Why now" line. If the primary window is thin, you may use the
            secondary window, and you must say which window the item came from.

            A deadline in the future is NOT news. This is the mistake that made
            the last three weeks of candidates repetitive: a deprecation
            announced in August has a deadline in February, and it stayed
            "important" every single morning, so it got proposed eleven times
            and written once. What makes something a candidate is that
            SOMETHING CHANGED IN THE WINDOW - an announcement, a date moved, a
            new release, a new bug report, a doc page rewritten. The deadline is
            context for the post, never the reason to write it today.

            Step 3. Do not repeat yourself.

            Reject any candidate whose headline contains a burned term from the
            brief, or that covers the same ground as anything in the "already
            proposed" list, whether or not it was ever written up. Not proposed
            before with different wording - not proposed before at all. If the
            only angle you can find on a burned topic is genuinely new because
            something changed in the window, say explicitly what changed and why
            it is not the same post.

            Step 4. Fewer is fine.

            Propose UP TO five candidates. Propose three if only three clear the
            bar. Propose one. If nothing in the window clears it, open the issue
            saying so, list what you looked at, and propose nothing. A thin news
            day is a real thing and an honest empty issue is worth more than
            five recycled headlines. You will not be judged on filling five
            slots.

            Also report any feed the brief says failed. A dead feed means less
            news reaching you, and that is how recycling starts.

            Step 5. Dedupe against what is published. List src/content/blog/ and
            grep it for your candidate keywords. Every candidate must be
            technical per the "technical, not business" section of the radar
            skill.

            Output. Create ONE GitHub issue using the gh CLI:

              gh issue create \
                --title "Journal candidates — <today's date, YYYY-MM-DD>" \
                --label journal-candidates \
                --body-file <a file you write>

            The body must contain up to five candidates, numbered from 1, each
            in the format the radar skill specifies: headline, category and read
            time, "Why now" (the source link AND the item's timestamp from the
            brief AND which window it came from), the angle, and the CTA target.
            After them, add one sentence naming which you would pick and why. If
            nothing cleared the bar, say that instead and list what you checked.

            Then close the previous candidate issue if one is still open. Find
            it with `gh issue list --label journal-candidates --state open`,
            comment "Superseded by #<new number>." on any issue older than this
            one, and close it. An unpicked candidate set is stale by the next
            morning and leaving it open buries the current one.

            End the issue body with exactly this line:

              ---
              Reply `/write N` on this issue to publish candidate N. Nothing is published until you do.

            Publish nothing. Write no blog post. Commit nothing to the
            repository. Creating the issue is the entire job.
          claude_args: |
            --model claude-opus-5
            --max-turns 120
            --allowedTools "WebSearch,WebFetch,Read,Glob,Grep,Write,Bash(curl:*),Bash(gh issue create:*),Bash(gh issue list:*),Bash(ls:*),Bash(grep:*),Bash(head:*),Bash(node scripts/:*),Bash(date:*)"
