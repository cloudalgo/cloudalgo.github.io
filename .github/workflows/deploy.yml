# .github/workflows/deploy.yml
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Until now these ran on nobody's machine but the author's. Two of the
      # three suites exist to catch a regression that is invisible in a green
      # build: legacy-redirects.test.ts resolves every redirect target to the
      # file that builds it, so renaming a post breaks the suite instead of
      # silently 404ing a URL Google still ranks; agent-allowlist.test.ts
      # checks the Journal robot's CI permissions against what its prompt and
      # skills tell it to type. Neither failure shows up in `astro build`.
      #
      # The cost is real and deliberate: a red test now blocks a publish,
      # including a Journal entry whose issue comment has already advertised
      # its URL. That is the correct order -- shipping a build we know is
      # broken to keep an announcement honest is the wrong trade.
      - name: Test
        run: npm test

      # CLAUDE.md calls this the only type gate this project has, which was
      # true in the sense that it had to be run by hand to be a gate at all.
      - name: Type check
        run: npm run astro check

      - name: Build
        run: npm run build
        env:
          PUBLIC_SCHEDULE_API_URL: ${{ secrets.PUBLIC_SCHEDULE_API_URL }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
