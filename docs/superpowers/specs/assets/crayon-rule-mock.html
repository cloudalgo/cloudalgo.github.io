<!doctype html><html><head><meta charset="utf-8"><title>Crayon rule — D, animated</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;700&display=swap">
<style>
body{background:#F7F4F2;color:#131110;font-family:Geist,system-ui,sans-serif;padding:48px;margin:0}
.row{margin:0 0 40px}
.cap{font:500 11px/1 ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:#756D66;margin-bottom:14px}
a.s{font-size:.875rem;font-weight:700;color:#131110;text-decoration:none;white-space:nowrap;
    position:relative;padding-bottom:7px;display:inline-block;transition:color .18s ease}
a.s:hover{color:#D6341A}

/* One sprite carrying three roughened passes side by side; the boil
   steps between them, so the whole animation is a single mask image. */
a.s::after{
  content:'';position:absolute;left:0;right:0;bottom:0;height:9px;
  background-color:#F75A41;
  mask-image:var(--u);
  mask-repeat:no-repeat;
  mask-size:300% 100%;
  mask-position:0% 0;
  animation:boil var(--boil,.75s) step-end infinite;
}
@keyframes boil{
  0%  {mask-position:0% 0}
  33% {mask-position:50% 0}
  66% {mask-position:100% 0}
}
/* Hover: erase left-to-right, then redraw the same way. */
a.s:hover::after{
  animation:boil var(--boil-fast,.3s) step-end infinite,
            redraw .55s cubic-bezier(.22,1,.36,1);
}
@keyframes redraw{
  0%   {clip-path:inset(0 0 0 0)}
  35%  {clip-path:inset(0 0 0 100%)}
  36%  {clip-path:inset(0 100% 0 0)}
  100% {clip-path:inset(0 0 0 0)}
}
a.s.big{font-size:2rem}
a.s.big::after{height:14px}
</style></head><body>
<div id="host"></div>
<script>
// Three roughened passes in one 600-wide sprite: same path, three
// turbulence seeds. mask-size:300% shows one 200-unit cell at a time.
const pass = (x, seed, w, scale, bf) => `<filter id='f${seed}' x='-10%' y='-70%' width='120%' height='240%'><feTurbulence type='fractalNoise' baseFrequency='${bf}' numOctaves='3' seed='${seed}' result='n'/><feDisplacementMap in='SourceGraphic' in2='n' scale='${scale}' xChannelSelector='R' yChannelSelector='G'/></filter><g filter='url(#f${seed})' transform='translate(${x} 0)'><path d='M2 6 C30 4 56 7.4 82 5.6 C110 3.7 136 7.6 162 5.4 C176 4.2 190 6.4 198 5' fill='none' stroke='#fff' stroke-width='${w}' stroke-linecap='round'/></g>`;

const sprite = (w, scale, bf='.62 .9') =>
  `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 10' preserveAspectRatio='none'>`
  + pass(0, 7, w, scale, bf) + pass(200, 21, w, scale, bf) + pass(400, 34, w, scale, bf) + `</svg>`;

const variants = {
  "F1 · 4.6 / 7.0 / .9 1.4   (= E4)": sprite(4.6, 7.0, '.9 1.4'),
  "F2 · 5.2 / 6.5 / .9 1.4":          sprite(5.2, 6.5, '.9 1.4'),
  "F3 · 5.2 / 8.0 / 1.3 1.9":         sprite(5.2, 8.0, '1.3 1.9'),
  "F4 · 6.0 / 9.0 / 1.3 1.9":         sprite(6.0, 9.0, '1.3 1.9')
};


let html='';
for (const name of Object.keys(variants)) {
  html += `<div class="row"><div class="cap">${name}</div>
   <a class="s" data-v="${name}" href="#">All products &rarr;</a>
   &nbsp;&nbsp;&nbsp;
   <a class="s big" data-v="${name}" href="#">Still maintain</a></div>`;
}
document.getElementById('host').innerHTML = html;
// The data URI carries double quotes and a '#'; both break an inline HTML
// style attribute, so the custom property is set from script instead.
document.querySelectorAll('a.s').forEach(a => {
  const enc = encodeURIComponent(variants[a.dataset.v]).replace(/'/g, '%27');
  a.style.setProperty('--u', `url("data:image/svg+xml,${enc}")`);
});
// Freeze the boil so a screenshot can show one cell: ?frame=0|1|2
const f = new URLSearchParams(location.search).get('frame');
if (f !== null) {
  const st = document.createElement('style');
  st.textContent = `a.s::after{animation:none;mask-position:${['0%','50%','100%'][+f]} 0}`;
  document.head.appendChild(st);
}
</script>
</body></html>
